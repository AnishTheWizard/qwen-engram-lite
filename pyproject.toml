[project]
name = "finalprojecttest"
version = "0.1.0"
description = "A naive, trainable Engram memory for a frozen Qwen2.5-0.5B backbone"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "safetensors>=0.4",
    "torch>=2.2",
    "transformers>=4.48,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
train-engram = "naive_engram.train:main"
sample-engram = "naive_engram.sample:main"
eval-triviaqa = "naive_engram.eval_triviaqa:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/naive_engram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
